services:

  # ──────────────────────────────────────────
  # Infra
  # ──────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: product_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: product_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ──────────────────────────────────────────
  # FastAPI
  # ──────────────────────────────────────────
  api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: api_server
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment: &python-env
      DATABASE_URL: postgresql://product_user:product_pass@postgres:5432/product_db
      REDIS_URL: redis://redis:6379/0
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      PYTHONPATH: /app
      RUN_MIGRATIONS: "true"
    volumes:
      - .:/app

  # ──────────────────────────────────────────
  # Celery Workers
  # ──────────────────────────────────────────
  celery-worker-crawl:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: celery_worker_crawl
    restart: unless-stopped
    command: celery -A app.celery.celery_app worker --loglevel=info --queues=crawl --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *python-env
    volumes:
      - .:/app

  celery-worker-cluster:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: celery_worker_cluster
    restart: unless-stopped
    command: celery -A app.celery.celery_app worker --loglevel=info --queues=cluster --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *python-env
    volumes:
      - .:/app

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: celery_beat
    restart: unless-stopped
    command: celery -A app.celery.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *python-env
    volumes:
      - .:/app

  # ──────────────────────────────────────────
  # Spring Boot
  # ──────────────────────────────────────────
  spring-server:
    build:
      context: ./spring-server
      dockerfile: Dockerfile
    container_name: spring_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_pass
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

volumes:
  postgres_data:
